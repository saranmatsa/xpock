# XPOCK — Default Configuration

# This file defines the default wave-structure generation parameters.
# Edit freely to explore different regions of the parameter space.
# All values are physically meaningful model parameters, not arbitrary
# visual settings.

grid:
  x_min: -5.0
  x_max: 5.0
  nx: 128
  y_min: -5.0
  y_max: 5.0
  ny: 128
  z_min: 0.0
  z_max: 1.0
  nz: 1
  t_min: -5.0
  t_max: 5.0
  nt: 128

temporal:
  shape: gaussian
  amplitude: 1.0
  center: 0.0
  duration: 1.0
  chirp_rate: 0.0
  carrier_freq: 0.0

spatial:
  mode: gaussian
  n: 0
  m: 0
  p: 0
  l: 0
  waist: 1.0
  wavelength: 1.0
  position_x: 0.0
  position_y: 0.0
  position_z: 0.0
  aperture_radius: null

polarization:
  state: linear
  angle: 0.0
  handedness: 1
  skyrmion_radius: 1.0
  skyrmion_charge: 1

topology:
  charge_type: winding
  charge: 0
  core_radius: 0.1

coherence:
  coherence_type: full
  coherence_time: 1.0
  coherence_length: 1.0
  spectral_width: 0.1

sweeps: []

fixed_params: {}

output_dir: ./xpock_output
generate_visualizations: true
save_events: true
