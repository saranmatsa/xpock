[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpock"
version = "0.1.0"
description = "XPOCK — Wave-Structure Generator: finite physical wave event generator for systematic exploration of information-bearing wave structures"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "XPOCK Project" }]
license = { text = "MIT" }
keywords = ["wave", "physics", "optics", "quantum", "topological", "spatiotemporal", "simulation"]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "pyyaml>=6.0",
    "dataclasses; python_version < '3.9'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]
cpp = [
    "pybind11>=2.10",
]
fortran = [
    "f2py; sys_platform == 'linux' or sys_platform == 'darwin'",
]

[project.scripts]
xpock = "xpock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"