[package]
name = "xpock-integration"
version = "0.1.0"
edition = "2021"
description = "Standalone Rust crate for topological signal detection and XPOCK/HX-241 integration. Carrier-agnostic: no TCP/IP/UDP/QUIC/WebRTC/libp2p or any existing networking stack."
license = "Proprietary"
repository = "https://github.com/saranmatsa/xpock"

[dependencies]
# Cryptographic primitives only — permitted per HX-241 carrier-agnostic constraint
# ed25519-dalek: Ed25519 signatures for node authentication
# chacha20poly1305: XChaCha20-Poly1305 for confidentiality
# sha2: SHA-256 for integrity
# blake3: BLAKE3 for fast hashing
# All other dependencies prohibited — no std::net, tokio::net, libp2p, QUIC, WebRTC, HTTP, etc.

[dev-dependencies]

[lib]
name = "xpock_integration"
path = "src/lib.rs"

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "adversarial_tests"
path = "tests/adversarial_tests.rs"